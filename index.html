<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Front Path</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f1419;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 480px;
      touch-action: none;
    }
    .hint {
      position: fixed;
      left: 0; right: 0; bottom: 8px;
      text-align: center;
      color: #556678;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div class="hint">Browser preview · tap an arrow to slide · same logic as WeChat mini-game</div>
  <script src="js/levels.js"></script>
  <script src="js/game-core.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('game');
      var game = new FrontPathGame(canvas, { dpr: window.devicePixelRatio || 1 });
      function fit() {
        var w = Math.min(window.innerWidth, 480);
        var h = window.innerHeight;
        game.resize(w, h, window.devicePixelRatio || 1);
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
