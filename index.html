<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1017" />
  <title>Front Path</title>
  <link rel="icon" href="data:,">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onerror="window.__cgFail=1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0b1017;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 480px;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <script src="js/levels.js?v=8"></script>
  <script src="js/game-core.js?v=8"></script>
  <script src="js/crazy.js?v=8"></script>
  <script>
    (function () {
      var canvas = document.getElementById('game');
      var P = window.FrontPathPlatform;
      var game = new FrontPathGame(canvas, { dpr: window.devicePixelRatio || 1, platform: P });
      P.attach(game);
      window.__frontPath = game;
      window.FrontPathPlatformInit().then(function (on) {
        if (on) { P.loadingStart(); P.loadingStop(); }
      });
      function fit() {
        var w = Math.min(window.innerWidth, 480);
        var h = window.innerHeight;
        game.resize(w, h, window.devicePixelRatio || 1);
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
